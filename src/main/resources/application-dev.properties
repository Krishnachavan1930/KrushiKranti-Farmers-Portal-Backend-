# =========================================
# Development Profile Overrides
# Activated when SPRING_PROFILES_ACTIVE=dev
# =========================================

# Show SQL in dev for debugging
spring.jpa.show-sql=true

# Database (MySQL) - defaults for local development
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/krushikranti_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Security - dev-only fallback (overridden by .env in real usage)
app.jwt.secret=${JWT_SECRET:KrushiKranti_MySQL_Dev_Secret_Change_This_in_Prod}

# Component API keys - pulled from .env, no defaults committed
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
