# =========================================
# KrushiKranti Backend - Application Config
# =========================================

# Runtime profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server
server.port=${PORT:8080}

# =========================================
# DataSource - MySQL
# =========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/krushikranti_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================
# JPA / Hibernate
# =========================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# =========================================
# JWT
# =========================================
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# =========================================
# OAuth2 - Google
# =========================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:336731970351-chmgdombvjsjui70h328o28g3001f9ia.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:CHANGE_ME_IN_ENV}
spring.security.oauth2.client.registration.google.scope=email,profile
app.oauth2.frontend-success-url=${OAUTH2_FRONTEND_SUCCESS_URL:http://localhost:5173}

# =========================================
# Swagger / SpringDoc OpenAPI
# =========================================
springdoc.api-docs.path=/api/v1/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.show-extensions=true
springdoc.swagger-ui.show-common-extensions=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.default-models-expand-depth=3
springdoc.swagger-ui.default-model-expand-depth=3
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.persist-authorization=true
springdoc.packages-to-scan=com.krushikranti.controller
springdoc.show-actuator=false

# =========================================
# CORS (Frontend Dev URL)
# =========================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# =========================================
# Logging
# =========================================
logging.level.com.krushikranti=INFO
logging.level.org.springframework=INFO
logging.level.org.springframework.security=INFO

# =========================================
# Cloudinary Configuration
# =========================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# =========================================
# Multipart File Upload
# =========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
app.upload.banner-dir=${BANNER_UPLOAD_DIR:uploads/banners}

# =========================================
# Email / SMTP Configuration (Gmail)
# =========================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# App name for emails
app.name=KrushiKranti

logging.level.org.hibernate.SQL=INFO

# =========================================
# Razorpay Configuration
# =========================================
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

# =========================================
# Shiprocket Configuration
# =========================================
shiprocket.email=${SHIPROCKET_EMAIL:YOUR_SHIPROCKET_EMAIL}
shiprocket.password=${SHIPROCKET_PASSWORD:YOUR_SHIPROCKET_PASSWORD}
shiprocket.api.base-url=${SHIPROCKET_API_BASE_URL:https://apiv2.shiprocket.in/v1/external}

# =========================================
# Admin Commission Configuration
# =========================================
app.commission.admin-percentage=0.10
app.commission.farmer-percentage=0.90
